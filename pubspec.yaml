name: travel_app
description: "A modern travel logistics and booking dashboard."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.12.4
  shared_preferences: ^2.2.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  google_generative_ai: ^0.4.7
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  # This tells Flutter to look inside the assets folder for your images
  assets:
    - assets/

# --- LAUNCHER ICONS CONFIGURATION ---
flutter_icons:
  android: true
  ios: true
  linux:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"